[package]
name = "herdr-roam"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Experimental SSH-bootstrapped WebTransport byte stream for Herdr"

[dependencies]
anyhow = "1"
base64 = "0.22"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
wtransport = { version = "0.7.2", features = ["quinn"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "io-std", "sync", "net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
